name: AirRing checks

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "./desktop[dev]"
      - run: pytest -q desktop/tests
      - run: python -m compileall -q desktop/src desktop/tools
      - run: make simulate

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install platformio
      - run: pio run
        working-directory: firmware/airring
      - uses: actions/upload-artifact@v4
        with:
          name: airring-esp32-firmware
          path: firmware/airring/.pio/build/esp32dev/firmware.bin
