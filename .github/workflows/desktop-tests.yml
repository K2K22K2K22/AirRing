name: AirRing checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e "./desktop[dev]"
      - run: pytest -q desktop/tests
      - run: python -m compileall -q desktop/src desktop/tools
      - run: make simulate

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run setup station tests
        run: npm test
        working-directory: site

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install "platformio==6.2.0"
      - run: pio run
        working-directory: firmware/airring
      - uses: actions/upload-artifact@v7
        with:
          name: airring-esp32-firmware
          path: firmware/airring/.pio/build/esp32dev/firmware.bin
